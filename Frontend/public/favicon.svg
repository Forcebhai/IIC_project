<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#438AFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#050816"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Central Neural Hexagon / Core -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner Core -->
  <circle cx="50" cy="50" r="10" fill="url(#grad1)"/>
  <!-- Neural Radiating nodes -->
  <circle cx="50" cy="22" r="3.5" fill="#00D4FF"/>
  <circle cx="74" cy="36" r="3.5" fill="#438AFF"/>
  <circle cx="74" cy="64" r="3.5" fill="#8B5CF6"/>
  <circle cx="50" cy="78" r="3.5" fill="#00D4FF"/>
  <circle cx="26" cy="64" r="3.5" fill="#438AFF"/>
  <circle cx="26" cy="36" r="3.5" fill="#8B5CF6"/>
  <!-- Cross Connectors -->
  <line x1="50" y1="22" x2="50" y2="40" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="74" y1="36" x2="58" y2="46" stroke="#438AFF" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="26" y1="36" x2="42" y2="46" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="78" x2="50" y2="60" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>

